services:
  fabric-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MC_VERSION: ${MC_VERSION:-26.3}
        FABRIC_LOADER_VERSION: ${FABRIC_LOADER_VERSION:-0.19.5}
        FABRIC_INSTALLER_VERSION: ${FABRIC_INSTALLER_VERSION:-1.1.2}
        JAVA_VERSION: ${JAVA_VERSION:-25}
    ports:
      - "${SERVER_PORT:-25565}:25565/tcp"
    environment:
      - MIN_RAM=${MIN_RAM:-1G}
      - MAX_RAM=${MAX_RAM:-4G}
    volumes:
      # All server files (auto-generated on first run)
      - ./serverdata:/server
      # Cache (overrides subdirs within /server)
      - ./cache/.fabric:/server/.fabric
      - ./cache/libraries:/server/libraries
      - ./cache/versions:/server/versions
